      summary: Query bot messages
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: author
          in: query
          schema:
            type: string
          description: Filter by author Discord ID
        - name: channel
          in: query
          schema:
            type: string
          description: Filter by channel ID
        - name: dm
          in: query
          schema:
            type: string
            enum: ["1"]
          description: Filter to DMs only
        - name: search
          in: query
          schema:
            type: string
          description: Search message content (LIKE match)
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Filter messages after this date
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: Filter messages before this date
      responses:
        "200":
          description: Paginated messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_PaginatedBotMessages"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permissions:
        - view:discord-bot
