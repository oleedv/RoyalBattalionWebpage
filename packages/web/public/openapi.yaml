  /discord-bot/timeouts:
    get:
      tags: [Discord Bot]
      summary: List ticket timeouts
      responses:
        "200":
          description: Timeouts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TicketTimeout"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permissions:
        - view:discord-bot
        - manage:discord-bot
    post:
      tags: [Discord Bot]
      summary: Create ticket timeout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, hours]
              properties:
                userId:
                  type: string
                hours:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: Timeout created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
