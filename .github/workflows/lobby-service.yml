name: Deploy Lobby Service

on:
  push:
    branches: [production]
    paths:
      - 'packages/lobby-service/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/royalbattalionwebpage-lobby-service

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/lobby-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-${{ github.sha }}

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/RoyalInfrastructure

            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            docker compose -f docker-compose.prod.yml pull lobby-service
            docker compose -f docker-compose.prod.yml up -d lobby-service

  health-check:
    name: Health Check
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Wait for startup
        run: sleep 15

      - name: Verify container is running
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            STATUS=$(docker ps --filter name=lobby-service-prod --format "{{.Status}}")
            echo "Container status: ${STATUS}"

            if [ -z "$STATUS" ]; then
              echo "Container is not running!"
              docker logs --tail 50 lobby-service-prod 2>&1 || true
              exit 1
            fi

            # Test health endpoint
            curl -sf http://localhost:3002/internal/health || {
              echo "Health check failed!"
              docker logs --tail 50 lobby-service-prod 2>&1 || true
              exit 1
            }

            echo "Lobby service is healthy"
