          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: level
          in: query
          schema:
            type: integer
          description: Filter by log level
        - name: module
          in: query
          schema:
            type: string
          description: Filter by module name
        - name: search
          in: query
          schema:
            type: string
          description: Search log messages (LIKE match)
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paginated logs
          content:
            application/json:
