      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-required-permissions:
        - view:audit-logs

  # ── Lobby ─────────────────────────────────────────────
  /lobby:
    post:
      tags: [Lobby]
      summary: Create a lobby link
      description: |
        Creates a lobby join link for a server (proxied through the API to avoid
        CORS). Replaces the old `POST /lobby/create/:serverName` path param.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serverName]
              properties:
                serverName:
                  type: string
      responses:
        "201":
          description: Lobby link created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                      serverId:
                        type: string
                      serverName:
                        type: string

  /lobby/health:
    get:
      tags: [Lobby]
      summary: Lobby service health
      responses:
        "200":
          description: Lobby health
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/LobbyHealth"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permissions:
        - manage:live-server

  /lobby/stats:
    get:
      tags: [Lobby]
      summary: Lobby service stats
      responses:
        "200":
          description: Lobby stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/LobbyStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permissions:
        - manage:live-server

  /lobby/steam/reconnect:
    post:
      tags: [Lobby]
      summary: Reconnect lobby service Steam client
      description: Enqueues a Steam reconnect on the lobby service (async). Returns 202 Accepted.
      responses:
        "202":
          description: Reconnect enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permissions:
        - manage:live-server

  # ── Playtime ──────────────────────────────────────────
  /playtime:
    get:
      tags: [Playtime]
      summary: Get player playtime aggregates
      parameters:
        - name: steamId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Playtime stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/PlaytimeStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permissions:
        - view:members
        - manage:members

  # ── Seeding Tracker ───────────────────────────────────
  /seeding-tracker/players:
    get:
      tags: [Seeding Tracker]
      summary: List/search seed-tracker players
      description: |
        Merged replacement for the old `/seeding-tracker/leaderboard` and
        `/seeding-tracker/search`. Pass `q` to search by name/Steam ID,
        otherwise returns the leaderboard.
      parameters:
        - name: q
