                      $ref: "#/components/schemas/ServerStatus"

  # ── Admins ────────────────────────────────────────────
  /admins/team-count:
    get:
      tags: [Admins]
      summary: Get in-game admin/team count
      description: Returns the number of admins on the team. No authentication required.
      security: []
      responses:
        "200":
          description: Admin team count
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
