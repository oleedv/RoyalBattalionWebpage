        - manage:squadjs

  # ── Server Config ─────────────────────────────────────
  /server-config:
    get:
      tags: [Server Config]
      summary: List server configs
      description: Returns all server configurations. SFTP passwords are masked.
      responses:
        "200":
          description: Server configs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServerConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permissions:
        - view:whitelist
    post:
      tags: [Server Config]
      summary: Create or update server config
      description: Upserts a server configuration. SFTP password is encrypted if ENCRYPTION_KEY is set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server, label]
              properties:
                server:
                  type: string
                  minLength: 1
                label:
                  type: string
                  minLength: 1
                sftpHost:
                  type: string
                  nullable: true
                sftpPort:
                  type: integer
                  default: 22
                sftpUser:
                  type: string
                  nullable: true
                sftpPass:
                  type: string
                  nullable: true
                sftpPath:
                  type: string
                  nullable: true
                syncEnabled:
                  type: boolean
      responses:
        "200":
          description: Config saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/ServerConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permissions:
        - admin

  /server-config/{server}:
    patch:
      tags: [Server Config]
      summary: Set SFTP sync state
      description: |
        Sets the SFTP sync enabled flag for a server to the client-supplied state
        (idempotent). Replaces the old `PUT /server-config/:server/sync` blind toggle.
      parameters:
        - name: server
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [syncEnabled]
              properties:
                syncEnabled:
                  type: boolean
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/ServerConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Server config not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-required-permissions:
        - manage:whitelist-sync
    delete:
      tags: [Server Config]
      summary: Delete server config
      parameters:
        - name: server
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Server config not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-required-permissions:
        - admin

