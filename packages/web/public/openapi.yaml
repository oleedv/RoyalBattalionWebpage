  /squadjs-config/{env}:
    get:
      tags: [SquadJS Config]
      summary: Read environment config
      description: Reads the SquadJS plugin configuration for a specific environment from GitHub.
      parameters:
        - name: env
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plugin configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      plugins:
