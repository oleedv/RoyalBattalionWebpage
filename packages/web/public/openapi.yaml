openapi: 3.0.3
info:
  title: Royal Battalion API
  description: |
    REST API for the Royal Battalion gaming community management platform.
    Handles user authentication (Discord OAuth), whitelist management,
    ticket/prospect tracking, match history, server administration,
    and Discord bot integration.

    ## Versioning
    All REST endpoints are versioned and served under the `/v1` prefix, which is
    baked into the `servers[].url` base below (so the paths documented here are
    relative to `/v1`, e.g. `/users` resolves to `/v1/users`).

    A few root-level, NON-versioned endpoints are exempt (external / infra
    contracts that must not move) and declare their own root `servers` override:
    - `GET /health` -- infra/Railway health probe.
    - `GET /admins.cfg` -- fetched by the Squad game server at a fixed URL.

    ## Authentication
    Most endpoints require a JWT Bearer token obtained via the `/auth/sync` endpoint.
    The flow is:
    1. User authenticates with Discord OAuth on the frontend
    2. Frontend sends the Discord access token to `POST /auth/sync`
    3. API returns a JWT (valid 4 hours) containing userId and permissions
    4. Include the JWT in all subsequent requests as `Authorization: Bearer <token>`

    ## Permissions
    Access is controlled by a granular RBAC system with 19 permissions.
    Users with the `admin` permission bypass all permission checks.

    ## Rate Limiting
    - Global: 200 requests/minute per IP
    - Per-route limits noted on individual endpoints

    ## WebSocket Endpoints
    - `ws://.../live-server/ws?token=<jwt>&server=<key>` -- Real-time server events and RCON
    - `ws://.../presence/ws?token=<jwt>&page=<path>` -- User presence tracking
  version: 1.0.0
  contact:
    name: Royal Battalion

servers:
  - url: https://api.royalbattalion.com/v1
    description: Production (all REST endpoints are versioned under /v1)
  - url: http://localhost:3001/v1
    description: Development (all REST endpoints are versioned under /v1)

tags:
  - name: Auth
    description: Authentication and session management
  - name: Users
    description: User account management
  - name: Roles
    description: Discord role-to-permission mapping
  - name: Whitelist
    description: Game server whitelist management
  - name: Clans
    description: Clan management
  - name: Tickets
    description: Support ticket management
  - name: Prospects
    description: Prospect (recruitment) tracking and evaluation
  - name: Legacy Tickets
    description: Read-only archive of legacy support tickets
  - name: Matches
    description: Match history and SquadJS sync
  - name: Servers
    description: BattleMetrics server status
  - name: Stats
    description: Dashboard statistics
  - name: Admins
    description: In-game admin/team information
  - name: Admin Groups
    description: Whitelist admin group management
  - name: SquadJS Config
    description: SquadJS plugin configuration via GitHub
  - name: Server Config
    description: SFTP deployment configuration per server
  - name: Discord Bot
    description: Discord bot management, seeding, timeouts
  - name: Audit Logs
    description: Audit log query and management
  - name: Lobby
    description: Squad lobby-link service (proxied)
  - name: Playtime
    description: Player playtime aggregates
  - name: Seeding Tracker
    description: Seeding leaderboard and player analytics
  - name: System
    description: Health checks and root-level infra endpoints

security:
  - bearerAuth: []

paths:
  # ── Auth ──────────────────────────────────────────────
  /auth/sync:
    post:
      tags: [Auth]
      summary: Authenticate via Discord OAuth
      description: |
        Exchanges a Discord access token for a JWT. Upserts the user in the database,
        syncs Discord roles to permissions, and returns the JWT along with user info.
        Rate limited to 10 requests/minute per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSyncRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_AuthSyncResponse"
        "403":
          description: User is not a member of the Discord guild
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error or Discord API failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user info
      description: Returns the authenticated user's profile and permissions.
      responses:
        "200":
          description: User info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_AuthMeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User not found in database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Users ─────────────────────────────────────────────
  /users:
    get:
      tags: [Users]
      summary: List users (paginated)
      description: |
        Returns a paginated page of users with their assigned roles.
        Supply `steamId` or `eosId` to resolve a user by that identity
        (returns the matching user(s) as the page).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: steamId
          in: query
          schema:
            type: string
          description: Filter to the user with this Steam ID
        - name: eosId
          in: query
          schema:
            type: string
          description: Filter to the user with this EOS ID
      responses:
        "200":
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_PaginatedUsers"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permissions:
        - view:members
        - manage:members

  /users/link-steam:
    post:
      tags: [Users]
      summary: Link Steam ID to current user
      description: Links a Steam ID to the authenticated user's account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steamId]
              properties:
                steamId:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Steam ID linked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      steamId:
                        type: string
        "400":
          description: Steam ID already linked to another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/sync-roles:
    post:
      tags: [Users]
      summary: Sync Discord roles for all users
      description: Triggers a bulk Discord role sync across all users in the database.
      responses:
        "200":
          description: Sync completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      updated:
                        type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: DISCORD_BOT_TOKEN not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-required-permissions:
        - manage:members

  /users/resolve-ids:
    post:
      tags: [Users]
      summary: Resolve Discord IDs to usernames
      description: Batch lookup of Discord usernames by Discord IDs (1-200).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [discordIds]
              properties:
                discordIds:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 200
      responses:
        "200":
          description: ID-to-name mapping
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    additionalProperties:
                      type: string
                    description: Map of Discord ID to username
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{id}:
    patch:
      tags: [Users]
      summary: Update user
      description: Partially update a user's identity/profile fields.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                steamId:
                  type: string
                eosId:
                  type: string
                country:
                  type: string
                membershipDate:
                  type: string
                  format: date-time
                  nullable: true
                dateOfBirth:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_UserWithRoles"
        "400":
          description: Steam ID conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-required-permissions:
        - manage:members
    delete:
      tags: [Users]
      summary: Delete user
      description: Permanently deletes a user account.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-required-permissions:
        - manage:members

  /users/{id}/status:
    patch:
      tags: [Users]
      summary: Set user enabled/disabled status
      description: |
        Merged replacement for the old `POST /users/:id/disable` + `/enable`.
        Set `disabled: true` (with an optional `reason`) to disable, or
        `disabled: false` to re-enable. Keeps the developer gate and
        self/developer guards.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disabled]
              properties:
                disabled:
                  type: boolean
                reason:
                  type: string
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      disabled:
                        type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-required-permissions:
        - manage:members

  /users/{id}/profile:
    get:
      tags: [Users]
      summary: Get unified user profile
      description: Returns a user's full profile (roles, comments, whitelist entries, live status).
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-required-permissions:
        - view:members
        - manage:members

  /users/profile:
    get:
      tags: [Users]
      summary: Get unified user profile by Steam ID
      description: |
        Resolves a unified user profile by Steam ID (query param).
        Replaces the old `GET /users/profile/by-steamid/:steamId` path param.
      parameters:
        - name: steamId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No profile for that Steam ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-required-permissions:
        - view:members
        - manage:members

  /users/{id}/comments:
    post:
      tags: [Users]
      summary: Add member comment
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/MemberComment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permissions:
        - manage:members

  /users/{id}/comments/{commentId}:
    delete:
      tags: [Users]
      summary: Delete member comment
      description: Deletes a comment scoped by both the user id and comment id.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-required-permissions:
        - manage:members

  /users/bulk-disable:
    post:
      tags: [Users]
      summary: Bulk disable members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, reason]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                reason:
                  type: string
      responses:
        "200":
          description: Bulk result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      disabled:
                        type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permissions:
        - manage:members

  /users/bulk-enable:
    post:
      tags: [Users]
      summary: Bulk enable members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Bulk result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      enabled:
                        type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permissions:
        - manage:members

  /users/bulk-update:
    post:
      tags: [Users]
      summary: Bulk update members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, data]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                data:
                  type: object
                  properties:
                    country:
                      type: string
                    membershipDate:
                      type: string
                      format: date-time
                      nullable: true
      responses:
        "200":
          description: Bulk result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      updated:
                        type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permissions:
        - manage:members

  /users/bulk-delete:
    post:
      tags: [Users]
      summary: Bulk delete members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Bulk result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      deleted:
                        type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permissions:
        - manage:members

  /users/bulk-comment:
    post:
      tags: [Users]
      summary: Bulk comment on members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, text]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                text:
                  type: string
      responses:
        "200":
          description: Bulk result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      commented:
                        type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permissions:
        - manage:members

  # ── Roles ─────────────────────────────────────────────
  /roles:
    get:
      tags: [Roles]
      summary: List all roles
      description: Returns all Discord roles with their mapped permissions and member counts.
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_DiscordRoleArray"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permissions:
        - manage:roles
    post:
      tags: [Roles]
      summary: Create role mapping
      description: Maps a Discord role ID to application permissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [discordRoleId, name]
              properties:
                discordRoleId:
                  type: string
                  minLength: 1
                name:
                  type: string
                  minLength: 1
                permissions:
                  type: array
                  items:
                    $ref: "#/components/schemas/Permission"
                  default: []
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_DiscordRole"
        "400":
          description: Discord role ID already mapped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permissions:
        - manage:roles

  /roles/{id}/permissions:
    put:
      tags: [Roles]
      summary: Update role permissions
      description: Replaces all permissions for a role.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  items:
                    $ref: "#/components/schemas/Permission"
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_DiscordRole"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-required-permissions:
        - manage:roles

  /roles/{id}/members:
    get:
      tags: [Roles]
      summary: List members with a role
      description: |
        Returns every registered user who currently has this role, ordered by
        Discord username. Capped at 5000. Used by the roles page roster.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Members who have the role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_RoleMemberArray"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-required-permissions:
        - manage:roles

  /roles/{id}:
    patch:
      tags: [Roles]
      summary: Update role flags
      description: |
        Merged replacement for the old `PUT /roles/:id/member-role` and
        `PUT /roles/:id/whitelist-grant` endpoints. Set either boolean flag
        (or both) in a single partial update. Returns the updated role.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isMemberRole:
                  type: boolean
                grantsWhitelist:
                  type: boolean
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_DiscordRole"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-required-permissions:
        - manage:roles
    delete:
      tags: [Roles]
      summary: Delete role mapping
      description: Removes a Discord role mapping and all associated permissions.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-required-permissions:
        - manage:roles

  # ── Whitelist ─────────────────────────────────────────
  /whitelist:
    get:
      tags: [Whitelist]
      summary: List whitelist entries
      description: Returns all whitelist entries, optionally filtered by server.
      parameters:
        - name: server
          in: query
          schema:
            type: string
          description: Filter by server key (e.g., "main", "battle")
      responses:
        "200":
          description: Whitelist entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_WhitelistEntryArray"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permissions:
        - view:whitelist
    post:
      tags: [Whitelist]
      summary: Add whitelist entry
      description: Adds a single whitelist entry and triggers SFTP deployment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWhitelistEntry"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_WhitelistEntry"
        "400":
          description: Steam ID already whitelisted on this server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permissions:
        - manage:whitelist

  /whitelist/candidates:
    get:
      tags: [Whitelist]
      summary: Get whitelist candidates
      description: >
        Returns pending and dismissed whitelist requests for a server. A pending
        request is a user with a whitelist-granting Discord role and linked Steam ID
        who does not have an active (non-expired, non-deactivated) entry on that
        server and has not been dismissed in the last 30 days.
      parameters:
        - name: server
          in: query
          schema:
            type: string
            default: main
      responses:
        "200":
          description: Pending and dismissed candidates with counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_WhitelistCandidateList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permissions:
        - manage:whitelist

  /whitelist/candidates/summary:
    get:
      tags: [Whitelist]
      summary: Whitelist request counts by server
      description: Pending request counts per server, used by the nav badge.
      responses:
        "200":
          description: Pending counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_WhitelistCandidateSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permissions:
        - manage:whitelist

  /whitelist/candidates/{userId}/dismiss:
    post:
      tags: [Whitelist]
      summary: Dismiss a whitelist request
      description: Hides the request for 30 days for all staff on the given server. Re-dismissing resets the 30-day window.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server]
              properties:
                server:
                  type: string
                reason:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: Dismissal stored
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: User not found
      x-required-permissions:
        - manage:whitelist

  /whitelist/candidates/{userId}/restore:
    post:
      tags: [Whitelist]
      summary: Restore a dismissed whitelist request
      description: Clears an active 30-day dismissal so the request reappears if the user is still eligible.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server]
              properties:
                server:
                  type: string
      responses:
        "200":
          description: Dismissal cleared
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No active dismissal found
      x-required-permissions:
        - manage:whitelist

  /whitelist/bulk:
    post:
      tags: [Whitelist]
      summary: Bulk add whitelist entries
      description: Adds multiple whitelist entries (1-500) and triggers SFTP deployment. Duplicate Steam IDs are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                server:
                  type: string
                  default: main
                entries:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [steamId]
                    properties:
                      steamId:
                        type: string
                      name:
                        type: string
                      clan:
                        type: string
                      role:
                        type: string
                      groupId:
                        type: string
                      reason:
                        type: string
      responses:
        "201":
          description: Bulk add result (duplicates are skipped, not failed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      created:
                        type: integer
                      skipped:
                        type: array
                        items:
                          type: object
                          properties:
                            steamId:
                              type: string
                            reason:
                              type: string
                              enum: [duplicate_existing, duplicate_in_batch]
                            existingName:
                              type: string
                              nullable: true
                            existingExpiresAt:
                              type: string
                              format: date-time
                              nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permissions:
        - manage:whitelist

  /whitelist/bulk-update:
    post:
      tags: [Whitelist]
      summary: Bulk update whitelist entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, data]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                data:
                  type: object
                  properties:
                    clanId:
                      type: string
                      nullable: true
                    groupId:
                      type: string
                      nullable: true
                    expiresAt:
                      type: string
                      format: date-time
                      nullable: true
      responses:
        "200":
          description: Bulk update result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      updated:
                        type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permissions:
        - manage:whitelist

  /whitelist/bulk-delete:
