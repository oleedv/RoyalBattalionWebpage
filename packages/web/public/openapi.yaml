                      count:
                        type: integer

  # ── Stats ─────────────────────────────────────────────
  /stats/summary:
    get:
      tags: [Stats]
      summary: Dashboard summary statistics
      description: |
        Returns aggregated stats for the dashboard. Fields are conditionally included
        based on the caller's permissions:
        - `servers` and `serverMetrics`: always included
        - `tickets` and `prospects`: admin only
        - `members`: admin or view:members
        - `whitelist`: admin or view:whitelist
        - `matches` and `recentMatches`: admin or manage:matches
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      servers:
                        type: array
                        items:
                          $ref: "#/components/schemas/ServerStatus"
                      serverMetrics:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            serverName:
                              type: string
                            metricHistory:
                              type: array
                              items:
                                type: object
                            playerCount:
                              type: integer
                            publicQueue:
                              type: integer
                            reserveQueue:
                              type: integer
                            maxPlayers:
                              type: integer
                      tickets:
                        type: object
                        properties:
                          open:
                            type: integer
                          closed:
                            type: integer
                      prospects:
                        type: object
                        properties:
                          open:
                            type: integer
                          accepted:
                            type: integer
                          denied:
                            type: integer
                      members:
                        type: object
                        properties:
                          total:
                            type: integer
                          withSteam:
                            type: integer
                      whitelist:
                        type: object
                        properties:
                          total:
                            type: integer
                      matches:
                        type: object
                        properties:
                          total:
                            type: integer
                          wins:
                            type: integer
                          losses:
                            type: integer
                          draws:
                            type: integer
                      recentMatches:
                        type: array
                        items:
                          $ref: "#/components/schemas/Match"
        "401":
          $ref: "#/components/responses/Unauthorized"

