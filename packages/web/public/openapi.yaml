        - manage:discord-bot

  /discord-bot/timeouts/{id}:
    delete:
      tags: [Discord Bot]
      summary: Expire (end) a ticket timeout
      description: Ends the active timeout. Replaces the old `POST /discord-bot/timeouts/:id/expire`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
