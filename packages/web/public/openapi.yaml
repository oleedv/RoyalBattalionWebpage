  /seeding-tracker/players/{steamId}:
    get:
      tags: [Seeding Tracker]
      summary: Get seed-tracker player detail
      parameters:
        - name: steamId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Player detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/SeedTrackerPlayerDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-required-permissions:
        - view:seeding-tracker

  /seeding-tracker/stats:
    get:
      tags: [Seeding Tracker]
      summary: Get seed-tracker summary stats
      responses:
        "200":
          description: Seed tracker stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/SeedTrackerStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permissions:
        - view:seeding-tracker

  # ── System ────────────────────────────────────────────
  # NOTE: the endpoints below are NOT versioned; they live at the root and
  # override the /v1 base with their own root-level `servers`.
  /health:
    servers:
      - url: https://api.royalbattalion.com
        description: Production (root, unversioned)
      - url: http://localhost:3001
        description: Development (root, unversioned)
    get:
      tags: [System]
      summary: Health check
      security: []
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /admins.cfg:
    servers:
      - url: https://api.royalbattalion.com
        description: Production (root, unversioned)
      - url: http://localhost:3001
        description: Development (root, unversioned)
    get:
      tags: [System]
      summary: Generate admins.cfg
      description: |
        Returns a plain-text Squad server admins.cfg file. Access is restricted
        to IPs listed in the `CFG_ALLOWED_IPS` environment variable.
      security: []
      parameters:
        - name: server
          in: query
          schema:
            type: string
          description: Server key (defaults to all servers)
      responses:
        "200":
          description: Admins config file
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: IP not in allowlist

  /live-server/servers:
    get:
      tags: [System]
      summary: List available SquadJS servers
      description: Returns the list of connected SquadJS server keys.
      security: []
      responses:
        "200":
          description: Server keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT obtained from POST /auth/sync

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 1-based page number
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 50
      description: Page size (server-capped)

  responses:
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NoContent:
      description: Success (no content)

  schemas:
    # ── Common ──────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string

    DeletedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            deleted:
              type: boolean
              example: true

    UpdatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            updated:
              type: boolean
              example: true

    # ── Pagination ──────────────────────────────────────
    Paginated:
      type: object
      description: Standard pagination envelope for growing collections.
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        hasNext:
          type: boolean

    ApiResponse_PaginatedUsers:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: "#/components/schemas/Paginated"
            - type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/UserWithRoles"

    ApiResponse_PaginatedMatches:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: "#/components/schemas/Paginated"
            - type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/Match"

    ApiResponse_PaginatedAuditLogs:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: "#/components/schemas/Paginated"
            - type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/AuditLogEntry"

    ApiResponse_PaginatedBotMessages:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: "#/components/schemas/Paginated"
            - type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/BotMessage"

    ApiResponse_PaginatedBotLogs:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          allOf:
            - $ref: "#/components/schemas/Paginated"
            - type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/BotLog"

    Permission:
      type: string
      enum:
        - view:whitelist
        - manage:whitelist
        - view:members
        - manage:members
        - view:tickets
        - manage:tickets
        - manage:roles
        - manage:matches
        - view:squadjs
        - manage:squadjs
        - view:live-server
        - manage:live-server
        - manage:whitelist-sync
        - view:discord-bot
        - manage:discord-bot
        - view:tickets:normal
        - view:tickets:community_officer
        - view:tickets:admin_officer
        - view:tickets:comp_team
        - view:tickets:whitelist
        - view:audit-logs
        - view:seeding-tracker
        - view:api-docs
        - manage:clan-move
        - manage:randomize
        - manage:balance-teams
        - manage:rcon-console
        - developer
        - admin

    # ── Auth ────────────────────────────────────────────
    AuthSyncRequest:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
          minLength: 1
          description: Discord OAuth access token

    AuthSyncResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT valid for 4 hours
        user:
          $ref: "#/components/schemas/UserWithRoles"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    AuthMeResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserWithRoles"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    ApiResponse_AuthSyncResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/AuthSyncResponse"

    ApiResponse_AuthMeResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/AuthMeResponse"

    # ── User ────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: string
        discordId:
          type: string
        discordName:
          type: string
        displayName:
          type: string
          nullable: true
        steamId:
          type: string
          nullable: true
        eosId:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        membershipDate:
          type: string
          format: date-time
          nullable: true
        dateOfBirth:
          type: string
          format: date-time
          nullable: true
        hasLoggedIn:
          type: boolean
        disabled:
          type: boolean
        disabledAt:
          type: string
          format: date-time
          nullable: true
        disabledReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserWithRoles:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            roles:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  discordRoleId:
                    type: string
                  name:
                    type: string

    ApiResponse_UserWithRoles:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/UserWithRoles"

    ApiResponse_UserWithRolesArray:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserWithRoles"

    # ── Roles ───────────────────────────────────────────
    DiscordRole:
      type: object
      properties:
        id:
          type: string
        discordRoleId:
          type: string
        name:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        grantsWhitelist:
          type: boolean
        isMemberRole:
          type: boolean
        memberCount:
          type: integer
          description: Number of registered users currently assigned this role

    RoleMember:
      type: object
      properties:
        id:
          type: string
        discordId:
          type: string
        discordName:
          type: string
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        hasLoggedIn:
          type: boolean
        disabled:
          type: boolean

    ApiResponse_RoleMemberArray:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/RoleMember"

    ApiResponse_DiscordRole:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/DiscordRole"

    ApiResponse_DiscordRoleArray:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/DiscordRole"

    # ── Whitelist ───────────────────────────────────────
    WhitelistEntry:
      type: object
      properties:
        id:
          type: string
        steamId:
          type: string
        server:
          type: string
        name:
          type: string
          nullable: true
        clan:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
        groupId:
          type: string
          nullable: true
        groupName:
          type: string
          nullable: true
        addedBy:
          type: string
        reason:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    AddWhitelistEntry:
      type: object
      required: [steamId]
      properties:
        steamId:
          type: string
          minLength: 1
        server:
          type: string
          default: main
        name:
          type: string
        clan:
          type: string
        role:
          type: string
        groupId:
          type: string
        reason:
          type: string
        expiresAt:
          type: string
          format: date-time

    WhitelistCandidate:
      type: object
      properties:
        userId:
          type: string
        discordName:
          type: string
        displayName:
          type: string
          nullable: true
        steamId:
          type: string
        avatarUrl:
          type: string
          nullable: true
        roleName:
          type: string
        roleNames:
          type: array
          items:
            type: string
        membershipDate:
          type: string
          format: date-time
          nullable: true

    DismissedWhitelistCandidate:
      allOf:
        - $ref: "#/components/schemas/WhitelistCandidate"
        - type: object
          properties:
            dismissedAt:
              type: string
              format: date-time
            dismissedBy:
              type: string
            dismissedByName:
              type: string
            expiresAt:
              type: string
              format: date-time
            reason:
              type: string
              nullable: true

    WhitelistCandidateList:
      type: object
      properties:
        pending:
          type: array
          items:
            $ref: "#/components/schemas/WhitelistCandidate"
        dismissed:
          type: array
          items:
            $ref: "#/components/schemas/DismissedWhitelistCandidate"
        meta:
          type: object
          properties:
            server:
              type: string
            pendingCount:
              type: integer
            dismissedCount:
              type: integer
            eligibleCount:
              type: integer
            alreadyWhitelistedCount:
              type: integer
            truncated:
              type: boolean

    WhitelistCandidateSummary:
      type: object
      properties:
        totalPending:
          type: integer
        byServer:
          type: array
          items:
            type: object
            properties:
              server:
                type: string
              pending:
                type: integer

    ApiResponse_WhitelistCandidateList:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/WhitelistCandidateList"

    ApiResponse_WhitelistCandidateSummary:
      type: object
      properties:
        success:
          type: boolean
