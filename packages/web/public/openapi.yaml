        - view:squadjs
        - manage:squadjs
    patch:
      tags: [SquadJS Config]
      summary: Write environment config
      description: Partially writes updated plugin configuration to GitHub for a specific environment (merges plugins).
      parameters:
        - name: env
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plugins]
              properties:
                plugins:
                  type: array
                  items:
                    $ref: "#/components/schemas/SquadJSPlugin"
      responses:
        "200":
          description: Config saved
          content:
            application/json:
              schema:
                type: object
                properties:
